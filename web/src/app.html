<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap"
      rel="stylesheet"
    />
    <script type="importmap">
      {
        "imports": {
          "cubing/scramble": "%sveltekit.assets%/vendor/cubing/scramble/index.js",
          "cubing/alg": "%sveltekit.assets%/vendor/cubing/alg/index.js"
        }
      }
    </script>
    <script>
      // Set the html.dark class before first paint so the page doesn't flash
      // light-then-dark on load. Kept in sync with src/lib/theme.svelte.ts.
      (function () {
        try {
          var saved = localStorage.getItem("cubing_theme");
          var prefersDark =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
          var dark = saved === "dark" || (saved !== "light" && prefersDark);
          if (dark) document.documentElement.classList.add("dark");
        } catch (_) {}
      })();
    </script>
    %sveltekit.head%
  </head>
  <body>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
