[project]
name = "cubing"
version = "0.1.0"
description = "Speedcubing algorithm repository with cube state diagrams."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "jinja2>=3.1",
    "jsonschema>=4.21",
    "lxml>=5.1",
]

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "types-beautifulsoup4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "RUF"]
ignore = ["RUF001"]  # ambiguous unicode chars — we deliberately handle them in alg normalization

[tool.mypy]
strict = true
python_version = "3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.uv]
package = false
